version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: steward_postgres
    restart: always
    environment:
      POSTGRES_USER: steward
      POSTGRES_PASSWORD: steward_secret
      POSTGRES_DB: steward_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: steward_redis
    restart: always
    ports:
      - '6379:6379'

  backend:
    build: ./backend
    container_name: steward_backend
    restart: always
    ports:
      - '8080:8080'
    environment:
      - DB_URL=postgres://steward:steward_secret@postgres:5432/steward_dev
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecretjwtkey
      - AGENT_SERVICE_URL=http://agents:8000
      - ENV=development
    depends_on:
      - postgres
      - redis

  agents:
    build: ./agents
    container_name: steward_agents
    restart: always
    ports:
      - '8000:8000'
    environment:
      - DB_URL=postgres://steward:steward_secret@postgres:5432/steward_dev
      - REDIS_URL=redis://redis:6379
      - GROQ_API_KEY=your_groq_api_key
      - OPENWEATHER_API_KEY=your_weather_api_key
      - ENV=development
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
